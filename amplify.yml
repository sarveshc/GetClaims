version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - |
          echo "=== Checking env vars available during build ==="
          echo "DATABASE_URL set: $(if [ -n "$DATABASE_URL" ]; then echo YES; else echo NO; fi)"
          echo "NEXTAUTH_URL set: $(if [ -n "$NEXTAUTH_URL" ]; then echo YES; else echo NO; fi)"
          echo "SMTP_HOST set: $(if [ -n "$SMTP_HOST" ]; then echo YES; else echo NO; fi)"
          echo "S3_BUCKET set: $(if [ -n "$S3_BUCKET" ]; then echo YES; else echo NO; fi)"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
