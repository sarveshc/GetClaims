version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          cat > .env.production << EOF
          DATABASE_URL=$DATABASE_URL
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          NEXTAUTH_URL=$NEXTAUTH_URL
          ADMIN_EMAIL=$ADMIN_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_USER=$SMTP_USER
          SMTP_PASS=$SMTP_PASS
          SMTP_FROM_EMAIL=$SMTP_FROM_EMAIL
          FROM_NAME=$FROM_NAME
          S3_REGION=$S3_REGION
          S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID
          S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY
          S3_BUCKET=$S3_BUCKET
          EOF
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
