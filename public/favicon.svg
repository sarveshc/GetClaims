<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White background -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>

  <!-- Umbrella dome — orange, 4 panels separated by white ribs -->
  <!-- Full dome arc from left (8,34) to right (56,34), peak at (32,8) -->
  <path d="M8 34 Q8 8 32 8 Q56 8 56 34 Z" fill="#FAA61B"/>

  <!-- White rib 1: far left panel divider -->
  <line x1="32" y1="34" x2="13" y2="14" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- White rib 2: left-center panel divider -->
  <line x1="32" y1="34" x2="23" y2="9"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- White rib 3: right-center panel divider -->
  <line x1="32" y1="34" x2="44" y2="9"  stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- White rib 4: far right panel divider -->
  <line x1="32" y1="34" x2="52" y2="16" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Re-draw dome edge to clean up rib ends -->
  <path d="M8 34 Q8 8 32 8 Q56 8 56 34 Z" fill="none" stroke="#FAA61B" stroke-width="1.5"/>

  <!-- Teal handle — vertical with a curved hook at bottom -->
  <path d="M32 34 L34 52 Q34 57 30 57 Q26 57 26 53"
        fill="none" stroke="#2D8B8E" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
