<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 620" width="501" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d7cf2"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d6efd" flood-opacity="0.12"/>
    </filter>
    <filter id="shieldShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0d6efd" flood-opacity="0.25"/>
    </filter>
    <filter id="badgeShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="501" height="620" fill="url(#bgGrad)" rx="18"/>

  <!-- Decorative dots top-left -->
  <circle cx="30" cy="30" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="55" cy="30" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="80" cy="30" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="30" cy="55" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="55" cy="55" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="80" cy="55" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="30" cy="80" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="55" cy="80" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="80" cy="80" r="4" fill="#bfdbfe" opacity="0.7"/>

  <!-- Decorative dots top-right -->
  <circle cx="421" cy="30" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="446" cy="30" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="471" cy="30" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="421" cy="55" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="446" cy="55" r="4" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="471" cy="55" r="4" fill="#bfdbfe" opacity="0.7"/>

  <!-- Header label -->
  <rect x="175" y="28" width="152" height="30" rx="15" fill="#0d6efd" opacity="0.12"/>
  <text x="251" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0d6efd" text-anchor="middle" letter-spacing="1.5">GETCLAIMS.IN</text>

  <!-- Main heading -->
  <text x="251" y="95" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#1a1a2e" text-anchor="middle">Your Rightful Claim.</text>
  <text x="251" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#1a1a2e" text-anchor="middle">Our Mission.</text>

  <!-- SHIELD — main hero element -->
  <g filter="url(#shieldShadow)">
    <path d="M251 155 L390 202 L390 318 C390 408 330 470 251 500 C172 470 112 408 112 318 L112 202 Z" fill="url(#shieldGrad)"/>
  </g>
  <!-- Shield inner lighter border -->
  <path d="M251 170 L375 212 L375 318 C375 399 320 456 251 484 C182 456 127 399 127 318 L127 212 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Large checkmark inside shield -->
  <polyline points="192,310 232,355 312,268" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- "NO WIN NO FEE" badge on shield -->
  <g filter="url(#badgeShadow)">
    <rect x="176" y="430" width="150" height="36" rx="18" fill="#059669"/>
  </g>
  <text x="251" y="453" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle" letter-spacing="0.5">✓  NO WIN NO FEE</text>

  <!-- ── Three stat cards at bottom ── -->
  <!-- Card 1: Claims Resolved -->
  <g filter="url(#cardShadow)">
    <rect x="22" y="508" width="143" height="96" rx="14" fill="url(#cardGrad)" stroke="#e0ebff" stroke-width="1"/>
  </g>
  <!-- Document icon -->
  <rect x="44" y="522" width="22" height="28" rx="3" fill="#dbeafe"/>
  <rect x="49" y="527" width="12" height="2" rx="1" fill="#0d6efd" opacity="0.6"/>
  <rect x="49" y="532" width="12" height="2" rx="1" fill="#0d6efd" opacity="0.6"/>
  <rect x="49" y="537" width="8"  height="2" rx="1" fill="#0d6efd" opacity="0.6"/>
  <text x="93" y="539" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#0d6efd" text-anchor="middle">₹50Cr</text>
  <text x="93" y="556" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#0d6efd" text-anchor="middle">+ Recovered</text>
  <text x="93" y="573" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">for our clients</text>
  <text x="93" y="590" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">★★★★★</text>

  <!-- Card 2: Cases -->
  <g filter="url(#cardShadow)">
    <rect x="179" y="508" width="143" height="96" rx="14" fill="url(#cardGrad)" stroke="#e0ebff" stroke-width="1"/>
  </g>
  <!-- People icon -->
  <circle cx="205" cy="533" r="8" fill="#dbeafe"/>
  <text x="205" y="537" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#0d6efd" text-anchor="middle">👤</text>
  <text x="250" y="539" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#0d6efd" text-anchor="middle">5,000+</text>
  <text x="250" y="556" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#0d6efd" text-anchor="middle">Cases Handled</text>
  <text x="250" y="573" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">across India</text>
  <text x="250" y="590" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#059669" text-anchor="middle">★★★★★</text>

  <!-- Card 3: Success -->
  <g filter="url(#cardShadow)">
    <rect x="336" y="508" width="143" height="96" rx="14" fill="url(#cardGrad)" stroke="#e0ebff" stroke-width="1"/>
  </g>
  <!-- Check icon -->
  <circle cx="362" cy="533" r="9" fill="#d1fae5"/>
  <polyline points="357,533 361,537 368,527" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="407" y="539" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#059669" text-anchor="middle">98%</text>
  <text x="407" y="556" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">Success Rate</text>
  <text x="407" y="573" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">IRDAI backed</text>
  <text x="407" y="590" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#059669" text-anchor="middle">★★★★★</text>

  <!-- Floating IRDAI badge top-right of shield -->
  <g filter="url(#cardShadow)">
    <rect x="350" y="168" width="120" height="52" rx="12" fill="white"/>
  </g>
  <circle cx="372" cy="194" r="14" fill="#eff6ff"/>
  <text x="372" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">🏛</text>
  <text x="415" y="188" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#1a1a2e" text-anchor="middle">IRDAI</text>
  <text x="415" y="202" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Compliant</text>

  <!-- Floating "Free Consult" badge left of shield -->
  <g filter="url(#cardShadow)">
    <rect x="28" y="230" width="108" height="52" rx="12" fill="white"/>
  </g>
  <circle cx="50" cy="256" r="14" fill="#d1fae5"/>
  <text x="50" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">💬</text>
  <text x="104" y="250" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">FREE</text>
  <text x="104" y="263" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Consultation</text>

</svg>
